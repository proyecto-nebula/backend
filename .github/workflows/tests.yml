name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend — PHPUnit
    runs-on: ubuntu-latest

    # 🚀 MySQL REAL en el job (OBLIGATORIO)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: test_db
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: test_secret

    steps:
      # 📥 Descargar repo
      - name: Checkout
        uses: actions/checkout@v4

      # 🐘 PHP 8.2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql, curl, json

      # 📦 Dependencias
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ⏳ Esperar MySQL listo
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot && echo "MySQL ready" && break || sleep 2
          done

      # 🗄️ Importar base de datos
      - name: Import database
        run: |
          mysql -h 127.0.0.1 -uroot -proot test_db < database/init.sql

      # 🚀 Levantar servidor PHP MVC
      - name: Start PHP server
        run: |
          nohup php -S 127.0.0.1:8000 -t public > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8000 && echo "Server ready" && break || sleep 1
          done

      # 🧪 Ejecutar PHPUnit
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --configuration phpunit.xml
